<!doctype html>
<html lang="en">
    <head>
        <title>K-pop profile name generator</title>
        <!-- Required meta tags -->
        <meta charset="utf-8" />
        <meta
            name="viewport"
            content="width=device-width, initial-scale=1, shrink-to-fit=no"
        />

        <!-- Bootstrap CSS v5.2.1 -->
        <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
            rel="stylesheet"
            integrity="sha384-T3c6CoIi6uLrA9TneNEoa7RxnatzjcDSCmG1MXxSR1GAsXEV/Dwwykc2MPK8M2HN"
            crossorigin="anonymous"
        />
        <link rel="stylesheet" href="styles.css">
    </head>

    <body>
        <header>
            K-pop profile name generator
        </header>
        <main>
            <div class="container mt-4">
                <div class="col-12">
                    <div class="card">
                        <div class="card-body">
                            <h5 class="card-title">Generate your K-pop profile name</h5>
                            <p class ="card-text">Answer the questions below to generate a random K-pop profile name!</p>
                            
                            <div class="youngest">
                                    <label for="q1" class="form-label fw-semibold">Are you the youngest in your family?</label>
                                    <select id="q1" class="form-select"> 
                                        <option value="" selected>Choose</option>
                                        <option value="youngest">Yes</option>
                                        <option value="oldest">No</option>
                                    </select>
                            </div>
                            <div class="name">
                                    <label for="q2" class="form-label fw-semibold">What is your first name?</label>
                                    <input type="text" id="q2" class="form-control">
                            </div>
                            <div class="lastName">
                                    <label for="q3" class="form-label fw-semibold">What date were you born?</label>
                                    <input type="date" id="q3" class="form-control">
                            </div>
                            <div class="groupRole">
                                    <label for="q4" class="form-label fw-semibold">When is your birthday month?</label>
                                    <input type="range" class="form-range" min="1" max="12" step="1" value="1" id="q4" oninput="updateMonthLabel(this.value)">
                            </div>
                            <div class="month-lable d-flex justify-content-between mt-2">
                                <span class="Jan">Jan</span>
                                <span class="Feb">Feb</span>
                                <span class="Mar">Mar</span>
                                <span class="Apr">Apr</span>
                                <span class="May">May</span>
                                <span class="Jun">Jun</span>
                                <span class="Jul">Jul</span>
                                <span class="Aug">Aug</span>
                                <span class="Sep">Sep</span>
                                <span class="Oct">Oct</span>
                                <span class="Nov">Nov</span>
                                <span class="Dec">Dec</span>
                            </div>
                            <div class="animal">
                                <label for="q5" class="form-label fw-semibold">What qualities would describe you? Choose 2!</label>
                                <div class="form-check">
                                    <input class="form-check-input" type="checkbox" value="" id="q5_confident">
                                    <label class="form-check-label" for="q5_confident">Confident</label>
                                </div>
                                <div class="form-check">
                                    <input class="form-check-input" type="checkbox" value="" id="q5_soft">
                                    <label class="form-check-label" for="q5_soft">Soft</label>
                                </div>
                                <div class="form-check">
                                    <input class="form-check-input" type="checkbox" value="" id="q5_kind">
                                    <label class="form-check-label" for="q5_kind">Kind</label>
                                </div>
                                <div class="form-check">
                                    <input class="form-check-input" type="checkbox" value="" id="q5_energetic">
                                    <label class="form-check-label" for="q5_energetic">Energetic</label>
                                </div>
                                <div class="form-check">
                                    <input class="form-check-input" type="checkbox" value="" id="q5_mysterious">
                                    <label class="form-check-label" for="q5_mysterious">Mysterious</label>
                                </div>
                                <div class="form-check">
                                    <input class="form-check-input" type="checkbox" value="" id="q5_chaotic">
                                    <label class="form-check-label" for="q5_chaotic">Chaotic</label>
                                </div>
                                <div class="form-check">
                                    <input class="form-check-input" type="checkbox" value="" id="q5_loyal">
                                    <label class="form-check-label" for="q5_loyal">Loyal</label>
                                </div>
                                <div class="form-check">
                                    <input class="form-check-input" type="checkbox" value="" id="q5_stupid">
                                    <label class="form-check-label" for="q5_stupid">Stupid</label>
                                </div>
                                <div class="form-check">
                                    <input class="form-check-input" type="checkbox" value="" id="q5_hardworking">
                                    <label class="form-check-label" for="q5_hardworking">Hardworking</label>
                                </div>
                                <div class="form-check">
                                    <input class="form-check-input" type="checkbox" value="" id="q5_charming">
                                    <label class="form-check-label" for="q5_charming">Charming</label>
                                </div>
                                <div class="form-check">
                                    <input class="form-check-input" type="checkbox" value="" id="q5_creative">
                                    <label class="form-check-label" for="q5_creative">Creative</label>
                                </div>
                            </div>
                            <button id="generateBtn" class="btn btn-primary mt-3">Generate Name</button>
                            <div class="result mt-4">
                                <h5>Your K-pop profile name is:</h5>
                                <p id="profileName" class="fw-bold"></p>
                    </div>
                </div>
            </div>
        </main>
        <footer>
            <!-- place footer here -->
        </footer>
        <script src="srcript.js"></script>
        <script
            src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.8/dist/umd/popper.min.js"
            integrity="sha384-I7E8VVD/ismYTF4hNIPjVp/Zjvgyol6VFvRkX/vR+Vc4jQkC+hVqc2pM8ODewa9r"
            crossorigin="anonymous"
        ></script>

        <script
            src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.min.js"
            integrity="sha384-BBtl+eGJRgqQAUMxJ7pMwbEyER4l1g+O15P+16Ep7Q9Q+zqX6gSbd85u4mG4QzX+"
            crossorigin="anonymous"
        ></script>
    </body>
</html>
